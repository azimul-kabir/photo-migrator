[project]
name = "photo-migrator"
version = "0.1.0"
description = "Safely inventory, deduplicate, plan, and build an Immich-ready photo library."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Azimul Kabir" }]
dependencies = [
  "Pillow>=10.0",
  "pillow-heif>=0.16",
  "tomli>=1.1.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2.0",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
photo-migrator = "photo_migrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_migrator"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/photo_migrator/database.py" = ["E501"]
"src/photo_migrator/planner.py" = ["E501"]
"src/photo_migrator/builder.py" = ["E501"]
"src/photo_migrator/cli.py" = ["E501"]
"src/photo_migrator/db_tools.py" = ["E501"]
"src/photo_migrator/doctor.py" = ["E501"]
"src/photo_migrator/recovery.py" = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "pillow_heif"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
